# 三棋思维教练 App - Release 构建工作流
# 手动触发（workflow_dispatch），构建 Tauri 桌面 + Android 产物
# 注意：Tauri 构建依赖 src-tauri/ 就绪，当前为预留配置
name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 v0.1.0）'
        required: true
        type: string
      platform:
        description: '构建目标平台'
        required: true
        type: choice
        options:
          - desktop-linux
          - android
          - all

jobs:
  # ─────────────────────────────────────────────
  # Job 1: 语义版本标签化
  # ─────────────────────────────────────────────
  tag-version:
    name: Tag Version ${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and push tag
        id: create-tag
        run: |
          TAG="${{ github.event.inputs.version }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────
  # Job 2: 桌面端构建（Linux AppImage / deb）
  # ─────────────────────────────────────────────
  desktop-linux:
    name: Desktop Linux (Tauri)
    runs-on: ubuntu-latest
    needs: [tag-version]
    # 仅在 src-tauri/ 就绪时执行
    if: hashFiles('src-tauri/Cargo.toml') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build Tauri desktop app
        run: |
          cd src-tauri
          cargo build --release

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanqi-coach-desktop-linux
          path: src-tauri/target/release/sanqi-coach
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 3: Android 构建（Tauri Android APK）
  # ─────────────────────────────────────────────
  android:
    name: Android APK (Tauri)
    runs-on: ubuntu-latest
    needs: [tag-version]
    if: hashFiles('src-tauri/Cargo.toml') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI & Android deps
        run: |
          cargo install tauri-cli --version "^2"
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          cd src-tauri
          cargo tauri android build --apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sanqi-coach-android-apk
          path: src-tauri/target/release/apk/*.apk
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 4: GitHub Release（汇总产物 + 创建 Release）
  # ─────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [tag-version, desktop-linux, android]
    # 至少一个平台构建成功即可发布
    if: always() && needs.tag-version.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate release notes
        run: |
          echo "## 三棋思维教练 App ${{ github.event.inputs.version }}" > release-notes.md
          echo "" >> release-notes.md
          echo "### 构建产物" >> release-notes.md
          echo "- Desktop Linux: sanqi-coach-desktop-linux" >> release-notes.md
          echo "- Android APK: sanqi-coach-android-apk" >> release-notes.md
          echo "" >> release-notes.md
          echo "### 变更" >> release-notes.md
          echo "请查看 CHANGELOG.md 或 Git log 获取详细变更。" >> release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          body_path: release-notes.md
          files: |
            artifacts/**/*
          draft: false
          prerelease: false