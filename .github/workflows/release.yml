# 三棋思维教练 App - Release 构建工作流
# 手动触发（workflow_dispatch），构建 Tauri 桌面 + Android 产物
# 说明：GitHub 的 job 级 if 不支持 hashFiles()，因此就绪检查放在 step 级，用 outputs 门控后续步骤。
name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 v0.1.0）'
        required: true
        type: string
      platform:
        description: '构建目标平台'
        required: true
        type: choice
        options:
          - desktop-linux
          - android
          - all

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Job 1: 语义版本标签化（幂等：tag 已存在则跳过）
  # ─────────────────────────────────────────────
  tag_version:
    name: Tag Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and push tag
        id: create_tag
        run: |
          TAG="${{ inputs.version }}"
          # 浅克隆下本地没有 tag，必须查远端；否则重复发布会因 tag 已存在而失败
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::notice::tag $TAG 已存在于远端，跳过创建"
          else
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # Job 2: 桌面端构建（Linux 可执行文件）
  # ─────────────────────────────────────────────
  desktop_linux:
    name: Desktop Linux (Tauri)
    runs-on: ubuntu-latest
    needs: [tag_version]
    if: inputs.platform == 'desktop-linux' || inputs.platform == 'all'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check src-tauri readiness
        id: readiness
        run: |
          if [ -f src-tauri/Cargo.toml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::src-tauri/Cargo.toml 不存在，跳过桌面构建"
          fi

      - name: Setup Node.js
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        if: steps.readiness.outputs.ready == 'true'
        run: npm ci

      - name: Build frontend
        if: steps.readiness.outputs.ready == 'true'
        run: npm run build

      - name: Setup Rust
        if: steps.readiness.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        if: steps.readiness.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache Cargo
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build Pikafish engine (x86-64, 内置运行时)
        if: steps.readiness.outputs.ready == 'true'
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          git clone --depth 1 https://github.com/official-pikafish/Pikafish /tmp/pika-src
          curl -sL -o /tmp/nnue.7z https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-09-06/Pikafish.2026-09-06.7z || true
          7z x -y -o/tmp/nnue /tmp/nnue.7z > /dev/null 2>&1 || true
          NNUE=$(find /tmp/nnue -name '*.nnue' | head -1 || true)
          echo "nnue: $NNUE"
          cd /tmp/pika-src/src
          make -j4 build ARCH=x86-64 COMP=gcc 2>&1 | tail -5
          OUT="$GITHUB_WORKSPACE/src-tauri/resources/engine"
          mkdir -p "$OUT"
          cp pikafish "$OUT/pikafish" && chmod +x "$OUT/pikafish"
          if [ -n "$NNUE" ]; then cp "$NNUE" "$OUT/pikafish.nnue"; fi
          ls -l "$OUT"

      - name: Build Tauri desktop app
        if: steps.readiness.outputs.ready == 'true'
        run: |
          cd src-tauri
          cargo build --release

      - name: Upload desktop artifact
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sanqi-coach-desktop-linux
          path: |
            src-tauri/target/release/sanqi-coach-core
            src-tauri/target/release/sanqi-coach
          if-no-files-found: warn
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 3: Android 构建（Tauri Android APK）
  # ─────────────────────────────────────────────
  android:
    name: Android APK (Tauri)
    runs-on: ubuntu-latest
    needs: [tag_version]
    if: inputs.platform == 'android' || inputs.platform == 'all'
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check src-tauri readiness
        id: readiness
        run: |
          if [ -f src-tauri/Cargo.toml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::src-tauri/Cargo.toml 不存在，跳过 Android 构建"
          fi

      - name: Setup Node.js
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        if: steps.readiness.outputs.ready == 'true'
        run: |
          # ubuntu-latest 自带 Android SDK，但预装 cmdline-tools 版本与 setup-android@v3 不匹配，
          # 因此不使用该 action，直接复用预装 SDK 并显式接受许可。
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMGR" ]; then echo "::error::未找到 sdkmanager"; exit 1; fi
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "ndk;${NDK_VERSION}" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk/${NDK_VERSION}" | head -3

      - name: Install frontend dependencies
        if: steps.readiness.outputs.ready == 'true'
        run: npm ci

      - name: Setup Rust with Android targets
        if: steps.readiness.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Init Android project
        if: steps.readiness.outputs.ready == 'true'
        run: npx tauri android init --ci

      - name: Build Pikafish engine (arm64-v8a, 内置运行时)
        if: steps.readiness.outputs.ready == 'true'
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          # 源码走 git（release 的 7z 里只有 Wiki 文档，没有源码）
          git clone --depth 1 https://github.com/official-pikafish/Pikafish /tmp/pika-src
          # NNUE 权重从 release 取
          curl -sL -o /tmp/nnue.7z https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-09-06/Pikafish.2026-09-06.7z || true
          7z x -y -o/tmp/nnue /tmp/nnue.7z > /dev/null 2>&1 || true
          NNUE=$(find /tmp/nnue -name '*.nnue' | head -1 || true)
          echo "nnue: $NNUE"
          cd /tmp/pika-src/src
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # Makefile 把 -lpthread -lrt 写死在链接行，而 bionic 里它们在 libc 中，
          # 直接用包装脚本过滤掉这两个参数（只影响链接，不影响编译）。
          printf '%s\n' '#!/usr/bin/env bash' 'args=()' 'for a in "$@"; do' '  case "$a" in' '    -lpthread|-lrt) ;;' '    *) args+=("$a") ;;' '  esac' 'done' 'exec "$REAL_CXX" "${args[@]}"' > /tmp/cxx-wrap.sh
          chmod +x /tmp/cxx-wrap.sh
          export REAL_CXX="$NDK_BIN/aarch64-linux-android24-clang++"
          make -j4 build ARCH=armv8 COMP=clang \
            CC="$NDK_BIN/aarch64-linux-android24-clang" \
            CXX="/tmp/cxx-wrap.sh" \
            STRIP="$NDK_BIN/llvm-strip" 2>&1 | tail -8
          ls -l pikafish
          DEST="$GITHUB_WORKSPACE/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          cp pikafish "$DEST/libpikafish.so"
          if [ -n "$NNUE" ]; then cp "$NNUE" "$DEST/pikafish.nnue"; fi
          ls -l "$DEST"

      - name: Build Android APK (debug, aarch64)
        if: steps.readiness.outputs.ready == 'true'
        run: npx tauri android build --apk --debug --target aarch64 --ci

      - name: Upload Android APK
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sanqi-coach-android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 4: GitHub Release（汇总产物 + 创建 Release）
  # ─────────────────────────────────────────────
  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [tag_version, desktop_linux, android]
    # 只要打标签成功就尝试发布；平台 job 被跳过不影响
    if: always() && needs.tag_version.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate release notes
        run: |
          echo "## 三棋思维教练 App ${{ inputs.version }}" > release-notes.md
          echo "" >> release-notes.md
          echo "### 构建产物" >> release-notes.md
          echo "- Desktop Linux: sanqi-coach-desktop-linux" >> release-notes.md
          echo "- Android APK: sanqi-coach-android-apk" >> release-notes.md
          echo "" >> release-notes.md
          echo "### 变更" >> release-notes.md
          echo "请查看 CHANGELOG.md 或 Git log 获取详细变更。" >> release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          body_path: release-notes.md
          files: artifacts/**/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
