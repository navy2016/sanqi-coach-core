name: Core CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust/setup@v1
        with:
          rust-version: "1.82"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Tauri deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: cargo check
        run: cargo check

      - name: cargo test
        run: cargo test -- --format detailed 2>/dev/null || cargo test

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc --noEmit